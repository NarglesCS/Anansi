services:
  # Anansi MCP Server (stdio-based for use with MCP clients)
  anansi:
    build:
      context: .
      dockerfile: Dockerfile
    image: anansi-mcp:local
    stdin_open: true
    tty: false
    environment:
      ANANSI_ALLOW_MUTATIONS: ${ANANSI_ALLOW_MUTATIONS:-0}
      ANANSI_MAX_DEPTH: ${ANANSI_MAX_DEPTH:-10}
      ANANSI_MAX_COMPLEXITY: ${ANANSI_MAX_COMPLEXITY:-100}
      ANANSI_MAX_RESULT_BYTES: ${ANANSI_MAX_RESULT_BYTES:-262144}
    profiles: ["mcp"]

  # UI + GraphQL Proxy (web-based interface)
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: anansi-ui:local
    container_name: anansi-ui
    ports:
      - "${UI_PORT:-8000}:8000"
    environment:
      ANANSI_ALLOW_MUTATIONS: ${ANANSI_ALLOW_MUTATIONS:-0}
      ANANSI_MAX_DEPTH: ${ANANSI_MAX_DEPTH:-10}
      ANANSI_MAX_COMPLEXITY: ${ANANSI_MAX_COMPLEXITY:-100}
      ANANSI_MAX_RESULT_BYTES: ${ANANSI_MAX_RESULT_BYTES:-262144}
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "8000"
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Example MCP client configurations (informational only)
  claude-desktop-example:
    image: alpine:3.20
    command: ["sh", "-c", "echo '📌 Claude Desktop: Configure .mcpServers.anansi in ~/Library/Application\\ Support/Claude/claude_desktop_config.json (macOS) or %%APPDATA%%\\Claude\\claude_desktop_config.json (Windows) to use: docker compose run --rm anansi'"]
    profiles: ["examples"]
    depends_on:
      - anansi

  vscode-example:
    image: alpine:3.20
    command: ["sh", "-c", "echo '📌 VS Code: Configure MCP settings to launch: docker compose run --rm -T anansi'"]
    profiles: ["examples"]
    depends_on:
      - anansi

  web-ui-example:
    image: alpine:3.20
    command: ["sh", "-c", "echo '✅ Web UI: Open http://localhost:${UI_PORT:-8000} in your browser'"]
    profiles: ["examples"]
    depends_on:
      - ui
