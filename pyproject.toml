[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphmcp"
version = "0.1.0"
description = "Proof of concept: an MCP server that exposes a typed GraphQL query surface"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "graphql-core>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
graphmcp = "graphmcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
